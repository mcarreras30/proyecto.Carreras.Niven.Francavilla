<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexo</title>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="./index.html">
        <img class="logo" src="./img/logo.jpeg" alt="logo de la tienda">
        </a>
      
        <div class="buscador">
                <form action="./search-results.html" method="get">
                <input type="text" name="search" placeholder="Buscador" value="">
                <button type="submit">🔍︎​</button>
            </form>
        </div>
        <nav class="registro" >
        <a  href="./index.html" class="registro-individual">HOME</a>
        <a  href="./login.html" class="registro-individual">INICIÁ SESIÓN </a>
        <a href="./register.html" class="registro-individual">REGISTRATE</a>
        </nav>
    </header>
    <main class="mainregister">
        <h1 class="tituloregistro">Registrate:</h1>
        <section class="section-register">
            <form action="./index.html" method="get">
                <div class="div-register textoregistro">
                    <label for="email">Email:</label>
                    <input id="email" type="email" name="Email" value="" required>
                </div>
                <div class="div-register textoregistro">
                    <label for="contraseña">Contraseña:</label>
                    <input id="contraseña" type="password" name="contraseña" value="" required>
                </div>
                <div class="div-register textoregistro">
                    <label for="repetircontraseña">Repetir contraseña:</label>
                    <input id="repetircontraseña" type="password" name="repetircontraseña" value="" required>
                </div>
                <div class="div-register textoregistro">
                    <input type="checkbox" name="terminosycondiciones" value="terminosycondiciones">
                    <label for="terminosycondiciones">Acepto terminos y condiciones</label>     
                </div>
                <div class="div-register">
                    <button type="submit" class="botonregistrarme">Registrarme</button>
                </div>
                <div>
                    <p>Ya tenes cuenta?</p><a href="./login.html">Inicia sesion acá</a>
                </div>
            </form>

        </section>
    </main>
    <footer class="footerregister">
        <p class="integrantes">Ambar Niven</p>
        <p class="integrantes">Margarita Carreras</p>
        <p class="integrantes">Micaela Francavilla</p>
    </footer>
</body>
</html>
